behaviors:
  ElectronBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 1000

environment_parameters:
  error_margin:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: ElectronBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 2.0
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: ElectronBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.7
        value: 0.5
      - name: Lesson2
        value: 0.1