behaviors:
  ElectronBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: {batch_size}
      buffer_size: {buffer_size}
      learning_rate: {learning_rate}
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: {hidden_units}
      num_layers: {num_layers}
      vis_encode_type: simple
      {memory_block}
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 500000
    time_horizon: 64
    summary_freq: 2000